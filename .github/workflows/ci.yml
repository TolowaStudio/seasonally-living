name: CI

# TOL-3005: this repo had no workflow, so the merge app saw checks=nochecks and
# could never auto-merge. The single job below is the required check ("gates").

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Content checks
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in scripts/check-*.ts; do
            echo "::group::$f"
            node --experimental-strip-types "$f"
            echo "::endgroup::"
          done

      - name: Build
        run: npm run build
